[package]
name = "hyprconfig"
version = "0.3.0"
description = "Configure Hyprland with a GUI"
authors = ["Alex Spinu"]
license = "MIT"
edition = "2024"
default-run = "hyprconfig"

[dependencies]
# Anomaly's Rune UI framework (not the crates.io scripting language). Both crates come from the
# same commit on rune's `dev` branch; bump them together.
rune = { git = "https://github.com/anomalyco/rune", rev = "ba5e7c8069a24c36f95ca90a3058083cd468fcd1", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ba5e7c8069a24c36f95ca90a3058083cd468fcd1" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hyprlang = { version = "0.5.0", features = ["hyprland", "mutation"] }
toml_edit = "0.25"
glob = "0.3.4"

[profile.dev.package."*"]
debug = false

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
