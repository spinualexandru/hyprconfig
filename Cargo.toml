[package]
name = "hyprconfig"
version = "0.6.0"
description = "Configure Hyprland with a GUI"
authors = ["Alex Spinu"]
license = "MIT"
edition = "2024"
default-run = "hyprconfig"

[dependencies]
# Anomaly's Rune UI framework (not the crates.io scripting language). Both crates come from the
# same commit on rune's `dev` branch; bump them together.
# Keep the headless scene/snapshot CLI available in release builds.
rune = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606", features = ["native-file-dialog", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hyprlang = { version = "0.5.0", features = ["mutation"] } # hyprpaper.conf only
toml_edit = "0.25"
glob = "0.3.4"

# Rune's patched dependencies must be declared by the consuming workspace. Keep their
# revision in sync with rune and rune-kit above.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
winit = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
